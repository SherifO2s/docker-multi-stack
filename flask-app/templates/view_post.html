{% extends "base.html" %}
{% block title %}{{ post[1] }} – Flask Blog{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="back-link">← Back to all posts</a>
<div class="card">
  <h2 class="page-title">{{ post[1] }}</h2>
  <p class="meta">Published on {{ post[3].strftime('%B %d, %Y at %H:%M') }}</p>
  <div class="post-content">{{ post[2] }}</div>
</div>
{% endblock %}
