{% extends "base.html" %}
{% block title %}New Post – Flask Blog{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="back-link">← Back to all posts</a>
<div class="card">
  <h2 class="page-title">Create New Post</h2>
  <form method="POST" action="{{ url_for('new_post') }}">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="Enter post title…" required />
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" name="content" placeholder="Write your post content here…" required></textarea>
    </div>
    <div style="display:flex; gap:.75rem;">
      <button type="submit" class="btn btn-primary">Publish Post</button>
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
